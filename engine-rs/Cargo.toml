[package]
name = "wake-word-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Wake word detection engine for the Wake Word VS Code extension"
license = "Apache-2.0"
publish = false

[[bin]]
name = "wake-word-engine"
path = "src/main.rs"

# serde_json: the config line is parsed into a serde_json::Value and read field
# by field rather than derived into a struct, because the Node engine accepts
# whatever JSON.parse() produces and coerces it in JavaScript: a non-string
# phrase is skipped, not fatal, and a missing threshold falls back to the
# default. A derived struct would reject those lines outright and change the
# engine's behaviour.
#
# decibri: microphone capture, conditioning, device selection, and Silero voice
# activity detection. Pinned exactly and bumped deliberately. Default features
# are off because they add playback, denoise, and echo cancellation, which the
# engine does not use. `gain` provides the AGC stage. `ort-load-dynamic` loads
# ONNX Runtime from a shared library at run time rather than linking it in; see
# src/assets.rs for where it is looked for.
#
# sherpa-onnx: the keyword spotter. Pinned exactly to the release the Node
# engine's sherpa-onnx package is built from, so the model files, the keyword
# line syntax, the boost, and the thresholds behave the same in both engines.
# The `static` feature links the C library and its own ONNX Runtime into the
# executable. The crate's build script downloads the official prebuilt static
# libraries for the target from the sherpa-onnx release of the same version and
# caches them under target/sherpa-onnx-prebuilt; SHERPA_ONNX_ARCHIVE_DIR names a
# directory holding the archive instead, and SHERPA_ONNX_LIB_DIR an already
# extracted lib directory. The release build sets SHERPA_ONNX_ARCHIVE_DIR to
# the archives scripts/pinned-inputs.mjs pins: the same release built without
# the text-to-speech components. See .cargo/config.toml for the C runtime
# those libraries need on Windows.
#
# The engine has no tokeniser: the extension tokenises the wake phrases and
# sends the keyword lines in the config line.
[dependencies]
serde_json = "1"
decibri = { version = "=6.3.0", default-features = false, features = ["capture", "vad", "gain", "ort-load-dynamic"] }
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["static"] }

[profile.release]
# This binary ships inside the .vsix, so size and start-up cost matter.
# panic = "abort" is deliberate: a panic on a worker thread would otherwise
# unwind that thread alone and leave the engine alive but deaf, where aborting
# lets the extension see the exit and restart the child.
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
