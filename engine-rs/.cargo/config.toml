# The prebuilt sherpa-onnx static libraries for Windows are compiled against
# the static C runtime (/MT). Rust's MSVC targets link the dynamic runtime by
# default, and mixing the two puts both runtimes in one image: the linker
# warns with LNK4098 and the process ends up with two heaps. Linking the static
# runtime here keeps the executable on one, and the executable itself imports
# no C runtime DLL. The ONNX Runtime library it loads for voice activity
# detection is a separate DLL, which does import one.
#
# Cargo reads this file only when it is run from this directory or below it,
# and a RUSTFLAGS environment variable replaces these flags rather than adding
# to them.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
