name: Release

on:
  release:
    types: [published]

jobs:
  release:
    # The extension's own releases are tagged vX.Y.Z. A release under any
    # other tag, one that hosts the speech model or the engine archives, must
    # not build, upload, or publish the extension.
    if: startsWith(github.event.release.tag_name, 'v')
    # The trusted publisher registered on Open VSX pins this environment, so
    # the registry issues a publishing token only to a job that runs in it.
    # Its deployment rule admits only tags matching v*, and it applies to
    # every step of the job.
    environment: open-vsx
    # Declaring permissions withholds every permission not listed.
    # contents: write lets checkout read the repository and the upload step
    # attach the .vsix to the release. id-token: write lets the Open VSX step
    # request the job's OIDC ID token. No other step needs a permission.
    permissions:
      contents: write
      id-token: write
    # The same checks as ci.yml, all before anything is uploaded or published.
    # lint marks the one leg that runs the checks whose answer does not depend
    # on the platform: ESLint and rustfmt.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            lint: false
          - os: macos-latest
            target: darwin-arm64
            lint: false
          - os: ubuntu-latest
            target: linux-x64
            lint: true
          # GitHub's public ARM runner label is ubuntu-24.04-arm, not a
          # variant of ubuntu-latest, which is x64.
          - os: ubuntu-24.04-arm
            target: linux-arm64
            lint: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - name: Lint
        if: matrix.lint
        run: npm run lint

      - name: Check the engine's formatting
        if: matrix.lint
        shell: bash
        working-directory: engine-rs
        run: |
          cargo fmt --version
          cargo fmt --check

      # Packaging compiles too; this is earlier because the model fetch below
      # reads the model's pins from dist/.
      - name: Compile
        run: npm run compile

      # The native engine, built on this runner for this target, staged into
      # bin/ with ONNX Runtime and the Silero model.
      - name: Build the native engine
        uses: ./.github/actions/engine-rs
        with:
          target: ${{ matrix.target }}

      # Clippy and the engine's unit tests, as in ci.yml.
      - name: Check the native engine
        uses: ./.github/actions/engine-rs-checks
        with:
          target: ${{ matrix.target }}

      # Build platform-specific .vsix package
      - name: Package extension
        run: npx vsce package --target ${{ matrix.target }} -o wake-word-${{ matrix.target }}-${{ github.event.release.tag_name }}.vsix

      # Fail the release before anything is uploaded or published if the
      # package is missing a file the engine needs, or its engine does not run
      # from the unpacked package.
      - name: Verify VSIX
        shell: bash
        run: node scripts/verify-vsix.mjs --target ${{ matrix.target }} --vsix wake-word-${{ matrix.target }}-${{ github.event.release.tag_name }}.vsix --extract-to "$RUNNER_TEMP/vsix"

      - name: Model cache key
        id: model-key
        shell: bash
        run: node scripts/fetch-model.mjs --print-sha >> "$GITHUB_OUTPUT"

      - name: Cache the keyword spotting model
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/kws-model
          key: kws-model-${{ steps.model-key.outputs.sha256 }}

      - name: Fetch the keyword spotting model
        id: model
        shell: bash
        run: |
          out=$(node scripts/fetch-model.mjs --dir "$RUNNER_TEMP/kws-model")
          echo "$out"
          echo "$out" | grep '^model-dir=' >> "$GITHUB_OUTPUT"

      # With the model, as in ci.yml, so the tokeniser tests run against it.
      - name: Test
        run: npm test
        env:
          WAKE_WORD_MODEL_DIR: ${{ steps.model.outputs.model-dir }}

      - name: Drive the packaged engine
        shell: bash
        env:
          WAKE_WORD_MODEL_DIR: ${{ steps.model.outputs.model-dir }}
          EXE: ${{ startsWith(matrix.target, 'win32') && 'wake-word-engine.exe' || 'wake-word-engine' }}
        run: node engine-rs/scripts/drive-protocol.mjs --bin "$RUNNER_TEMP/vsix/extension/bin/$EXE" --no-microphone

      # Attach .vsix to the GitHub release. The marketplace job publishes the
      # attached file.
      - name: Upload .vsix to release
        uses: softprops/action-gh-release@v3
        with:
          files: wake-word-${{ matrix.target }}-${{ github.event.release.tag_name }}.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish to Open VSX Registry with trusted publishing: ovsx exchanges
      # the job's OIDC ID token for a publishing token that expires within
      # minutes and can publish only this extension, so the workflow needs no
      # stored Open VSX token. --trusted-publishing fails the step when no ID
      # token is available, rather than looking for a stored access token or
      # asking for one. An access token given with -p, --pat, or OVSX_PAT
      # takes precedence over trusted publishing, so the job sets none.
      # On a re-run attempt, --skip-duplicate ends the step with success, and
      # publishes nothing, when the registry answers that this version is
      # already published for this target. The first attempt leaves the flag
      # out, as the Marketplace step does.
      - name: Publish to Open VSX
        run: npx ovsx publish wake-word-${{ matrix.target }}-${{ github.event.release.tag_name }}.vsix --trusted-publishing ${{ github.run_attempt != '1' && '--skip-duplicate' || '' }}

  marketplace:
    # Publishes to the VS Code Marketplace the four packages that the release
    # job checked and attached to the release. It runs only when every leg of
    # the release job has succeeded, so only for a release tagged v*.
    needs: release
    # The federated credential of the Microsoft Entra identity that publishes
    # to the Marketplace names this environment, so only a job that runs in
    # it can sign in as that identity. Its deployment rule admits only tags
    # matching v*, and its secrets hold the identity's client and tenant IDs.
    environment: microsoft-marketplace
    # Declaring permissions withholds every permission not listed.
    # contents: read lets checkout read the repository and gh read the
    # release's assets. id-token: write lets the sign-in step request the
    # job's OIDC ID token.
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      # The targets of the release job's matrix.
      TARGETS: win32-x64 darwin-arm64 linux-x64 linux-arm64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      # Download each target's package from the release, and stop if a file
      # differs from the SHA-256 digest that GitHub recorded when the release
      # job's upload step attached it.
      - name: Download the verified packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir "$RUNNER_TEMP/marketplace"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.digest) \(.name)"' > "$RUNNER_TEMP/asset-digests.txt"
          for target in $TARGETS; do
            file="wake-word-$target-$TAG.vsix"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$file" --dir "$RUNNER_TEMP/marketplace"
            line="sha256:$(sha256sum "$RUNNER_TEMP/marketplace/$file" | cut -d ' ' -f 1) $file"
            if ! grep -qxF "$line" "$RUNNER_TEMP/asset-digests.txt"; then
              echo "::error::$file does not match the digest of its release asset"
              exit 1
            fi
            echo "$line"
          done

      # Sign in to Microsoft Entra ID as the identity that is a member of the
      # Marketplace publisher. The step requests the job's OIDC ID token for
      # the audience that the identity's federated credential accepts, masks
      # it, and exchanges it with the Azure CLI that the runner image
      # provides. --allow-no-subscriptions signs in an identity that holds no
      # role on any Azure subscription.
      - name: Sign in to Microsoft Entra ID
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          token=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | node -e 'const { value } = JSON.parse(require("fs").readFileSync(0, "utf8")); if (!value) process.exit(1); process.stdout.write(value)')
          echo "::add-mask::$token"
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" --federated-token "$token" --allow-no-subscriptions --output none

      # Publish the downloaded packages to the VS Code Marketplace.
      # --azure-credential has vsce take the identity's Microsoft Entra token
      # from the Azure CLI sign-in. vsce uses a Personal Access Token, given
      # with -p or in its environment variable, before --azure-credential, so
      # the job gives none. vsce reads each package's target platform from
      # its manifest and refuses --target beside --packagePath, so the step
      # gives none. On a re-run attempt, --skip-duplicate skips, and does not
      # fail on, each target that the Marketplace already has this version
      # for, so a re-run publishes only the targets that an earlier attempt
      # did not. The first attempt leaves the flag out, so a version that is
      # already published, such as one that package.json was not raised for,
      # fails the step.
      - name: Publish to VS Code Marketplace
        run: npx vsce publish --azure-credential --packagePath "$RUNNER_TEMP"/marketplace/*.vsix ${{ github.run_attempt != '1' && '--skip-duplicate' || '' }}
