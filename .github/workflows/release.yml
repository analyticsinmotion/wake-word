name: Release

on:
  release:
    types: [published]

jobs:
  release:
    # The extension's own releases are tagged vX.Y.Z. A release under any
    # other tag, one that hosts the speech model or the engine archives, must
    # not build, upload, or publish the extension.
    if: startsWith(github.event.release.tag_name, 'v')
    # The trusted publisher registered on Open VSX pins this environment, so
    # the registry issues a publishing token only to a job that runs in it.
    # Its deployment rule admits only tags matching v*, and it applies to
    # every step of the job, the Marketplace publish included.
    environment: open-vsx
    # Declaring permissions withholds every permission not listed.
    # contents: write lets checkout read the repository and the upload step
    # attach the .vsix to the release. id-token: write lets the Open VSX step
    # request the job's OIDC ID token. No other step needs a permission.
    permissions:
      contents: write
      id-token: write
    # The same checks as ci.yml, all before anything is uploaded or published.
    # lint marks the one leg that runs the checks whose answer does not depend
    # on the platform: ESLint and rustfmt.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            lint: false
          - os: macos-latest
            target: darwin-arm64
            lint: false
          - os: ubuntu-latest
            target: linux-x64
            lint: true
          # GitHub's public ARM runner label is ubuntu-24.04-arm, not a
          # variant of ubuntu-latest, which is x64.
          - os: ubuntu-24.04-arm
            target: linux-arm64
            lint: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - name: Lint
        if: matrix.lint
        run: npm run lint

      - name: Check the engine's formatting
        if: matrix.lint
        shell: bash
        working-directory: engine-rs
        run: |
          cargo fmt --version
          cargo fmt --check

      # Packaging compiles too; this is earlier because the model fetch below
      # reads the model's pins from dist/.
      - name: Compile
        run: npm run compile

      # The native engine, built on this runner for this target, staged into
      # bin/ with ONNX Runtime and the Silero model.
      - name: Build the native engine
        uses: ./.github/actions/engine-rs
        with:
          target: ${{ matrix.target }}

      # Clippy and the engine's unit tests, as in ci.yml.
      - name: Check the native engine
        uses: ./.github/actions/engine-rs-checks
        with:
          target: ${{ matrix.target }}

      # Build platform-specific .vsix package
      - name: Package extension
        run: npx vsce package --target ${{ matrix.target }} -o wake-word-${{ matrix.target }}-${{ github.event.release.tag_name }}.vsix

      # Fail the release before anything is uploaded or published if the
      # package is missing a file the engine needs, or its engine does not run
      # from the unpacked package.
      - name: Verify VSIX
        shell: bash
        run: node scripts/verify-vsix.mjs --target ${{ matrix.target }} --vsix wake-word-${{ matrix.target }}-${{ github.event.release.tag_name }}.vsix --extract-to "$RUNNER_TEMP/vsix"

      - name: Model cache key
        id: model-key
        shell: bash
        run: node scripts/fetch-model.mjs --print-sha >> "$GITHUB_OUTPUT"

      - name: Cache the keyword spotting model
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/kws-model
          key: kws-model-${{ steps.model-key.outputs.sha256 }}

      - name: Fetch the keyword spotting model
        id: model
        shell: bash
        run: |
          out=$(node scripts/fetch-model.mjs --dir "$RUNNER_TEMP/kws-model")
          echo "$out"
          echo "$out" | grep '^model-dir=' >> "$GITHUB_OUTPUT"

      # With the model, as in ci.yml, so the tokeniser tests run against it.
      - name: Test
        run: npm test
        env:
          WAKE_WORD_MODEL_DIR: ${{ steps.model.outputs.model-dir }}

      - name: Drive the packaged engine
        shell: bash
        env:
          WAKE_WORD_MODEL_DIR: ${{ steps.model.outputs.model-dir }}
          EXE: ${{ startsWith(matrix.target, 'win32') && 'wake-word-engine.exe' || 'wake-word-engine' }}
        run: node engine-rs/scripts/drive-protocol.mjs --bin "$RUNNER_TEMP/vsix/extension/bin/$EXE" --no-microphone

      # Attach .vsix to the GitHub release
      - name: Upload .vsix to release
        uses: softprops/action-gh-release@v3
        with:
          files: wake-word-${{ matrix.target }}-${{ github.event.release.tag_name }}.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish to the VS Code Marketplace the .vsix that the Package step
      # wrote and the Verify step checked: the file the upload step attached
      # to the release and the file the Open VSX step publishes. vsce reads
      # the target platform from the package's manifest and refuses --target
      # beside --packagePath, so the step gives none. On a re-run attempt,
      # --skip-duplicate ends the step with success, and publishes nothing,
      # when the Marketplace already has this version for this target, so a
      # re-run of the release, or of one of its legs, does not fail on a
      # target that an earlier attempt published. The first attempt leaves
      # the flag out, so a version that is already published, such as one
      # that package.json was not raised for, fails the step.
      - name: Publish to VS Code Marketplace
        run: npx vsce publish --packagePath wake-word-${{ matrix.target }}-${{ github.event.release.tag_name }}.vsix ${{ github.run_attempt != '1' && '--skip-duplicate' || '' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # Publish to Open VSX Registry with trusted publishing: ovsx exchanges
      # the job's OIDC ID token for a publishing token that expires within
      # minutes and can publish only this extension, so the workflow needs no
      # stored Open VSX token. --trusted-publishing fails the step when no ID
      # token is available, rather than looking for a stored access token or
      # asking for one. An access token given with -p, --pat, or OVSX_PAT
      # takes precedence over trusted publishing, so the job sets none.
      # On a re-run attempt, --skip-duplicate ends the step with success, and
      # publishes nothing, when the registry answers that this version is
      # already published for this target. The first attempt leaves the flag
      # out, as the Marketplace step does.
      - name: Publish to Open VSX
        run: npx ovsx publish wake-word-${{ matrix.target }}-${{ github.event.release.tag_name }}.vsix --trusted-publishing ${{ github.run_attempt != '1' && '--skip-duplicate' || '' }}
