name: Release

on:
  release:
    types: [published]

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            lint: true
          - os: macos-latest
            target: darwin-arm64
            lint: false
          - os: ubuntu-latest
            target: linux-x64
            lint: false
          # GitHub's public ARM runner label is ubuntu-24.04-arm, not a
          # variant of ubuntu-latest, which is x64.
          - os: ubuntu-24.04-arm
            target: linux-arm64
            lint: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - name: Install engine dependencies
        run: cd engine && npm install

      # npm installs only the @decibri platform package whose os/cpu fields
      # match the runner, so this directory normally holds one package already.
      # This step turns that into a guarantee: any other platform's binary is
      # removed, and the build fails unless exactly one package matching the
      # target remains. The smoke test and the .vsix below then see the tree
      # that ships.
      - name: Prune non-target engine binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cd engine/node_modules/@decibri
          kept=0
          for dir in */; do
            case "$dir" in
              *"$TARGET"*) kept=$((kept + 1)) ;;
              *) echo "Removing $dir"; rm -rf "$dir" ;;
            esac
          done
          echo "Remaining @decibri packages:"
          ls -la
          if [ "$kept" -ne 1 ]; then
            echo "::error::Expected exactly one @decibri package matching $TARGET, found $kept"
            exit 1
          fi

      # Fail the release before publishing if the shipped engine tree cannot
      # load on this platform.
      - name: Smoke test engine
        run: node engine/audio-engine.js --self-test

      - name: Lint and compile
        if: matrix.lint
        run: |
          npm run lint
          npm run compile

      # Build platform-specific .vsix package
      - name: Package extension
        run: npx vsce package --target ${{ matrix.target }} -o wake-word-${{ matrix.target }}-${{ github.event.release.tag_name }}.vsix

      # Attach .vsix to the GitHub release
      - name: Upload .vsix to release
        uses: softprops/action-gh-release@v3
        with:
          files: wake-word-${{ matrix.target }}-${{ github.event.release.tag_name }}.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish to VS Code Marketplace
      - name: Publish to VS Code Marketplace
        run: npx vsce publish --target ${{ matrix.target }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # Publish to Open VSX Registry
      - name: Publish to Open VSX
        run: npx ovsx publish wake-word-${{ matrix.target }}-${{ github.event.release.tag_name }}.vsix -p ${{ secrets.OVSX_PAT }}
