name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  build:
    # Mirrors the release.yml matrix so platform-specific breakage is caught on
    # the PR, not at publish time.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: macos-latest
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      # The engine tree is the only dependency tree that ships to users, and a
      # broken engine dependency has shipped a dead release before (v0.5.0).
      - name: Install engine dependencies
        run: cd engine && npm install
