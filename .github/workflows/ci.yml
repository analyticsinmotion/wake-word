name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  build:
    # Mirrors the release.yml matrix so platform-specific breakage is caught on
    # the PR, not at publish time.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: macos-latest
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-x64
          # GitHub's public ARM runner label is ubuntu-24.04-arm, not a
          # variant of ubuntu-latest, which is x64.
          - os: ubuntu-24.04-arm
            target: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      # The keyword spotting model the extension downloads, 17 MB, cached by
      # its pinned digest. With it, the tests that check the tokeniser against
      # the real model run instead of being skipped, and so do the engine
      # scenarios below that load the spotter.
      - name: Model cache key
        id: model-key
        shell: bash
        run: node scripts/fetch-model.mjs --print-sha >> "$GITHUB_OUTPUT"

      - name: Cache the keyword spotting model
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/kws-model
          key: kws-model-${{ steps.model-key.outputs.sha256 }}

      - name: Fetch the keyword spotting model
        id: model
        shell: bash
        run: |
          out=$(node scripts/fetch-model.mjs --dir "$RUNNER_TEMP/kws-model")
          echo "$out"
          echo "$out" | grep '^model-dir=' >> "$GITHUB_OUTPUT"

      - name: Test
        run: npm test
        env:
          WAKE_WORD_MODEL_DIR: ${{ steps.model.outputs.model-dir }}

      # The engine tree ships to users, and a broken engine dependency has
      # shipped a dead release before (v0.5.0).
      - name: Install engine dependencies
        run: cd engine && npm install

      # npm installs only the @decibri platform package whose os/cpu fields
      # match the runner, so this directory normally holds one package already.
      # This step turns that into a guarantee: any other platform's binary is
      # removed, and the build fails unless exactly one package matching the
      # target remains. The smoke test and the .vsix below then see the tree
      # that ships.
      - name: Prune non-target engine binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cd engine/node_modules/@decibri
          kept=0
          for dir in */; do
            case "$dir" in
              *"$TARGET"*) kept=$((kept + 1)) ;;
              *) echo "Removing $dir"; rm -rf "$dir" ;;
            esac
          done
          echo "Remaining @decibri packages:"
          ls -la
          if [ "$kept" -ne 1 ]; then
            echo "::error::Expected exactly one @decibri package matching $TARGET, found $kept"
            exit 1
          fi

      # Loads decibri, sherpa-onnx, and sentencepiece-js on this platform and
      # exits. Catches MODULE_NOT_FOUND and native ABI mismatches, neither of
      # which the source tree shows: v0.4.0 shipped exactly that failure.
      - name: Smoke test engine
        run: node engine/audio-engine.js --self-test

      # The native engine, built on this runner for this target, staged into
      # bin/ with ONNX Runtime and the Silero model. See the action for the
      # per-platform details.
      - name: Build the native engine
        uses: ./.github/actions/engine-rs
        with:
          target: ${{ matrix.target }}

      # Packaging is what actually broke twice. Building the artifact on the
      # pull request catches a vsce failure before it reaches a release.
      - name: Package VSIX
        run: npx vsce package --target ${{ matrix.target }} -o wake-word-${{ matrix.target }}-ci.vsix

      # A package that builds is not a package that runs. This checks the
      # artifact itself, then unpacks it and runs the engine's self-test from
      # the unpacked copy.
      - name: Verify VSIX
        shell: bash
        run: node scripts/verify-vsix.mjs --target ${{ matrix.target }} --vsix wake-word-${{ matrix.target }}-ci.vsix --extract-to "$RUNNER_TEMP/vsix"

      # The protocol scenarios that need no microphone, against the packaged
      # binary and the runtime files beside it. They include the spotter and
      # the voice activity detector loading their two ONNX Runtimes in one
      # process.
      - name: Drive the packaged engine
        shell: bash
        env:
          WAKE_WORD_MODEL_DIR: ${{ steps.model.outputs.model-dir }}
          EXE: ${{ startsWith(matrix.target, 'win32') && 'wake-word-engine.exe' || 'wake-word-engine' }}
        run: node engine-rs/scripts/drive-protocol.mjs --bin "$RUNNER_TEMP/vsix/extension/bin/$EXE" --no-microphone
