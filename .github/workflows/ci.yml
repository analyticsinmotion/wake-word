name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  build:
    # Mirrors the release.yml matrix so platform-specific breakage is caught on
    # the PR, not at publish time.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: macos-latest
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-x64
          # GitHub's public ARM runner label is ubuntu-24.04-arm, not a
          # variant of ubuntu-latest, which is x64.
          - os: ubuntu-24.04-arm
            target: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      # The engine tree is the only dependency tree that ships to users, and a
      # broken engine dependency has shipped a dead release before (v0.5.0).
      - name: Install engine dependencies
        run: cd engine && npm install

      # npm installs only the @decibri platform package whose os/cpu fields
      # match the runner, so this directory normally holds one package already.
      # This step turns that into a guarantee: any other platform's binary is
      # removed, and the build fails unless exactly one package matching the
      # target remains. The smoke test and the .vsix below then see the tree
      # that ships.
      - name: Prune non-target engine binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cd engine/node_modules/@decibri
          kept=0
          for dir in */; do
            case "$dir" in
              *"$TARGET"*) kept=$((kept + 1)) ;;
              *) echo "Removing $dir"; rm -rf "$dir" ;;
            esac
          done
          echo "Remaining @decibri packages:"
          ls -la
          if [ "$kept" -ne 1 ]; then
            echo "::error::Expected exactly one @decibri package matching $TARGET, found $kept"
            exit 1
          fi

      # Loads decibri, sherpa-onnx, and sentencepiece-js on this platform and
      # exits. Catches MODULE_NOT_FOUND and native ABI mismatches, neither of
      # which the source tree shows: v0.4.0 shipped exactly that failure.
      - name: Smoke test engine
        run: node engine/audio-engine.js --self-test

      # Packaging is what actually broke twice. Building the artifact on the
      # pull request catches a vsce failure before it reaches a release.
      - name: Package VSIX
        run: npx vsce package --target ${{ matrix.target }} -o wake-word-${{ matrix.target }}-ci.vsix
