version: 2
updates:
  # Build and publish toolchain, and sentencepiece-js, the one package here that
  # ships in the .vsix. Its pin must match the engine tree's;
  # tests/unit/tokeniser.test.ts fails when they differ.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The engine tree, which ships in the .vsix.
  - package-ecosystem: npm
    directory: "/engine"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
