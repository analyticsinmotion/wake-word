version: 2
updates:
  # The build and publish toolchain. The extension has no runtime dependency,
  # so nothing from npm ships in the .vsix.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # The @typescript-eslint packages are released together, and
    # eslint-plugin requires a parser of its own version or later, so their
    # version updates are raised in one pull request.
    groups:
      typescript-eslint:
        patterns: ["@typescript-eslint/*"]
    ignore:
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The engine. decibri and sherpa-onnx are pinned exactly and bumped
  # deliberately: a sherpa-onnx bump needs its archives built by the Engine
  # archives workflow, published on a sherpa-onnx-v<version> release, and
  # pinned in engine-rs/scripts/pinned-inputs.mjs, or CI fails the build. The
  # pull request is the notice that a new version exists.
  - package-ecosystem: cargo
    directory: "/engine-rs"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
