version: 2
updates:
  # The build and publish toolchain, and sentencepiece-js, the one package
  # that ships in the .vsix. sentencepiece-js is pinned exactly, because the
  # pieces it produces are what the keyword lines are built from:
  # tests/unit/tokeniser.test.ts checks them against a pinned table.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The engine. decibri and sherpa-onnx are pinned exactly and bumped
  # deliberately: a sherpa-onnx bump needs its archives built by the Engine
  # archives workflow, published on a sherpa-onnx-v<version> release, and
  # pinned in engine-rs/scripts/pinned-inputs.mjs, or CI fails the build. The
  # pull request is the notice that a new version exists.
  - package-ecosystem: cargo
    directory: "/engine-rs"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
